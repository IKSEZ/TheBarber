<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Minha Barbearia</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16140F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login" class="login" hidden>
  <div class="login-box">
    <div class="logo" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></svg>
    </div>
    <h1>Minha Barbearia</h1>
    <p class="muted" id="login-sub">Entre para registrar seus atendimentos.</p>

    <div id="login-aviso" class="aviso" hidden>
      Falta configurar o Firebase. Abra o arquivo <b>firebase-config.js</b> e cole os dados do seu projeto (veja o README).
    </div>

    <form id="login-form" novalidate>
      <label class="field">
        <span>E-mail</span>
        <input id="login-email" type="email" autocomplete="email" inputmode="email" placeholder="voce@email.com" required>
      </label>
      <label class="field">
        <span>Senha</span>
        <input id="login-senha" type="password" autocomplete="current-password" placeholder="Sua senha" required>
      </label>
      <label class="field" id="login-conf-wrap" hidden>
        <span>Confirmar senha</span>
        <input id="login-conf" type="password" autocomplete="new-password" placeholder="Repita a senha">
      </label>
      <div id="login-erro" class="erro" role="alert" hidden></div>
      <button id="login-btn" class="btn-primary" type="submit">Entrar</button>
    </form>

    <div class="login-links">
      <button type="button" class="link" id="login-toggle">Criar conta</button>
      <button type="button" class="link" id="login-reset">Esqueci a senha</button>
    </div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="app" hidden>
  <!--- BANNER DE INSTALAÇÃO --->
  <div id="install-banner" style="display:none; background:var(--card, #1A1A1A); padding:15px; border-radius:12px; margin:15px; text-align:center; border: 1px solid var(--border, #333); z-index: 100;">
    <p id="install-text" style="margin:0 0 10px 0; font-weight:600; font-size:14px;">
      Instale o aplicativo da Barbearia para acesso rápido!
    </p>
    <button id="btn-instalar" class="btn-primary" style="width:100%">
      Instalar Aplicativo
    </button>
  </div>
  <main id="view" class="view"></main>

  <nav class="nav" id="nav" aria-label="Navegação principal">
    <button data-act="nav" data-v="atender">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></svg>
      Atender
    </button>
    <button data-act="nav" data-v="dashboard">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      Dashboard
    </button>
    <button data-act="nav" data-v="gestao">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
      Gestão
    </button>
  </nav>
</div>

<!-- ============ FOLHA (formulários) ============ -->
<div id="sheet" class="backdrop" hidden>
  <form id="sheet-form" class="sheet" novalidate></form>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
